name: Deploy Campaign

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Campaign to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting Campaign Deployment"
            echo "======================================"

            cd /root/campaign

            echo "=== Pull latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Installing server dependencies ==="
            cd /root/campaign/server
            npm install

            echo "=== Generating Prisma Client ==="
            npx prisma generate

            echo "=== Syncing database schema ==="
            npx prisma db push

            echo "=== Installing client dependencies ==="
            cd /root/campaign/client
            npm install

            echo "=== Building client ==="
            npm run build

            echo "=== Restarting backend ==="
            pm2 restart campaign-server

            echo "=== Restarting frontend ==="
            pm2 restart campaign-client

            echo "=== Saving PM2 ==="
            pm2 save

            echo "======================================"
            echo "Campaign Deployment Completed"
            echo "======================================"
